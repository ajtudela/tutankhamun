name: Tutankhamun Build macOS

# As Akhenaten (akhenaten_mac_arm.yml, akhenaten_mac_x64.yml): one build per architecture on the arm64 macos-latest
# runner, Unix Makefiles, the oldest macOS 11.7 for arm64 and 10.15 for x86_64 (packaging/macos/build_dmg.sh).

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            artifact: macos_arm_build
          - arch: x86_64
            artifact: macos_x64_build
    name: build the disk image (${{ matrix.arch }})
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: build
      run: bash packaging/macos/build_dmg.sh ${{ matrix.arch }} build/macos
    - name: check the configs
      # the runner is arm64: the x86_64 program is not started there
      if: matrix.arch == 'arm64'
      run: build/macos/arm64/bin/Tutankhamun.app/Contents/MacOS/Tutankhamun --check-configs config
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: build/macos/Tutankhamun-${{ matrix.arch }}.dmg
