name: Tutankhamun Build Android

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  apk:
    name: build the APK
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1
    - uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
    - name: build
      working-directory: android
      env:
        TUTANKHAMUN_VERSION_CODE: ${{ github.run_number }}
      run: ./gradlew --no-daemon assembleRelease
    - uses: actions/upload-artifact@v4
      with:
        name: android_apk
        path: android/app/build/outputs/apk/release/app-release.apk
    # Google Play, as in Julius (.ci_scripts/run_build.sh): the bundle signed with the upload key of the repository's
    # secrets (ANDROID_UPLOAD_KEYSTORE: the .jks in base64; ANDROID_UPLOAD_STORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS,
    # ANDROID_UPLOAD_KEY_PASSWORD). A push to main with the service account's JSON key (PLAY_SERVICE_ACCOUNT_JSON) also
    # publishes it to the internal testing track, the release notes being the last commit's title; without the key the
    # bundle is only built, without the upload key (forks, pull requests) the step does nothing. versionCode is the run
    # number, so every bundle can be uploaded.
    - name: build the Google Play bundle
      if: github.event_name != 'pull_request'
      working-directory: android
      env:
        UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
        TUTANKHAMUN_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
        TUTANKHAMUN_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        TUTANKHAMUN_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        TUTANKHAMUN_VERSION_CODE: ${{ github.run_number }}
      run: |
        if [ -z "$UPLOAD_KEYSTORE" ]; then
          echo "no upload key in the secrets: the bundle is not built"
          exit 0
        fi
        echo "$UPLOAD_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
        export TUTANKHAMUN_UPLOAD_STORE_FILE="$RUNNER_TEMP/upload.jks"
        if [ -n "$ANDROID_PUBLISHER_CREDENTIALS" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
          git log -1 --pretty=%s | cut -c1-500 > app/src/main/play/release-notes/en-US/default.txt
          ./gradlew --no-daemon publishReleaseBundle
        else
          [ "$GITHUB_REF" = "refs/heads/main" ] && echo "no PLAY_SERVICE_ACCOUNT_JSON in the secrets: the bundle is not published"
          ./gradlew --no-daemon bundleRelease
        fi
        rm -f "$RUNNER_TEMP/upload.jks"
    - uses: actions/upload-artifact@v4
      if: github.event_name != 'pull_request'
      with:
        name: android_aab
        path: android/app/build/outputs/bundle/release/app-release.aab
        if-no-files-found: ignore
