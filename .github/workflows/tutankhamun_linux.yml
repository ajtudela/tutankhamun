name: Tutankhamun Build Linux

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  appimage:
    name: build the AppImage
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # the commit count is the build number (CMakeLists.txt)
    - name: install the build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ninja-build libfuse2 \
          libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev \
          libwayland-dev libxkbcommon-dev wayland-protocols libdecor-0-dev libasound2-dev libpulse-dev libdbus-1-dev libudev-dev
    - name: build
      env:
        CMAKE_GENERATOR: Ninja
      run: packaging/linux/build_appimage.sh build/appimage
    - name: check the configs
      run: build/appimage/bin/tutankhamun --check-configs config
    - uses: actions/upload-artifact@v4
      with:
        name: linux_appimage
        path: build/appimage/Tutankhamun-x86_64.AppImage
