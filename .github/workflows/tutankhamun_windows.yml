name: Tutankhamun Build Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  windows:
    name: build on windows
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
    - name: configure
      run: cmake --preset win-msvc-release-vs2022
    - name: build
      run: cmake --build --preset win-msvc-release-vs2022
    - name: install
      run: cmake --install out/build/win-msvc-release-vs2022 --config Release --prefix windows_build
    - uses: actions/upload-artifact@v4
      with:
        name: windows_build
        path: windows_build
