// The Android build of tutankhamun: the app module (app/) builds the game's native code with the top-level
// CMakeLists.txt through the NDK and packs it with SDL2's Java glue and the game folder picker into an APK (or the
// bundle for Google Play).
plugins {
    id 'com.android.application' version '8.11.1' apply false
    // Gradle Play Publisher, as in Julius: the bundle and the store listing to Google Play (app/build.gradle)
    id 'com.github.triplet.play' version '3.13.0' apply false
}
